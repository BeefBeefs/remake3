name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push cancels an older run that hasn't deployed yet
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # the tests use `node --experimental-transform-types` (Node >= 22.7)

      # No package-lock.json is committed yet (the first install has to happen on a machine with registry access).
      # Once you have run `npm install` locally and committed the lockfile, switch this to `npm ci` and add
      # `cache: npm` to setup-node above.
      - run: npm install

      - name: Unit tests (format, map, animation, game logic)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
