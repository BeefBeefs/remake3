<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NightStone map editor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0e12; color: #d6d6d6; font: 12px ui-monospace, Menlo, monospace; overflow: hidden; }
      #app { display: flex; height: 100%; }
      #side { width: 292px; flex: none; overflow-y: auto; background: #1a1b22; border-right: 1px solid #000; padding: 8px; box-sizing: border-box; }
      #side h3 { margin: 10px 0 4px; font-size: 12px; color: #e2c768; font-weight: normal; border-bottom: 1px solid #333; }
      #side h3:first-child { margin-top: 0; }
      select, input, button { background: #0e0f13; color: #d6d6d6; border: 1px solid #3a3a46; padding: 3px 6px; font: inherit; }
      button { cursor: pointer; } button:hover { background: #262833; } button.on { border-color: #e2c768; color: #f6e49a; }
      .row { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; align-items: center; }
      #pal { display: flex; flex-wrap: wrap; gap: 2px; max-height: 330px; overflow-y: auto; margin-top: 4px; background: #101116; padding: 2px; }
      #pal canvas { border: 1px solid transparent; cursor: pointer; background: #23252f; } #pal canvas.sel { border-color: #e2c768; }
      #stage { flex: 1; position: relative; min-width: 0; }
      #view { display: block; width: 100%; height: 100%; cursor: crosshair; }
      #info { position: absolute; left: 8px; bottom: 6px; color: #cbb26a; text-shadow: 0 1px 2px #000; pointer-events: none; }
      a { color: #8ab4ff; } small { color: #8a8f9c; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side"></div>
      <div id="stage"><canvas id="view"></canvas><div id="info">Loading…</div></div>
    </div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
